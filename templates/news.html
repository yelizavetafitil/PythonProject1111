<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новости предприятия | РУП Белнипиэнергопром</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/portal-responsive.css') }}">
    <style>
        :root {
            --primary: #1c4f9c;
            --primary-soft: #2a65c0;
            --text: #1c2f4b;
            --muted-text: #667f9f;
            --border: #d8e2f0;
            --card-shadow: 0 8px 22px rgba(21, 45, 84, 0.1);
        }
        body {
            background-color: #081a48;
            background-image:
                radial-gradient(circle at 50% 42%, rgba(130, 230, 255, 0.18) 0%, rgba(130, 230, 255, 0) 48%),
                linear-gradient(180deg, rgba(8, 26, 72, 0.56) 0%, rgba(8, 26, 72, 0.66) 100%),
                url("{{ url_for('project_asset', filename='back4.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: "Inter", sans-serif;
            color: var(--text);
        }
        .navbar {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 12px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 10px rgba(20, 42, 75, 0.06);
        }
        .logo img { height: 40px; width: auto; display: block; }
        .topbar-actions { display: flex; align-items: center; gap: 10px; }
        .topbar-user { font-size: 15px; color: #4d678b; margin-right: 4px; }
        .topbar-btn {
            height: 40px;
            border-radius: 10px !important;
            padding: 0 16px !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }
        .btn-outline-secondary {
            color: var(--primary);
            border-color: var(--primary);
            border-radius: 8px;
            font-weight: 600;
        }
        .btn-outline-secondary:hover { background: var(--primary); border-color: var(--primary); color: #fff; }
        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
            border-radius: 8px;
            font-weight: 600;
        }
        .btn-primary:hover { background: var(--primary-soft); border-color: var(--primary-soft); }
        .btn-light { background: var(--primary); border-color: var(--primary); color: #fff; }
        .btn-light:hover { background: var(--primary-soft); border-color: var(--primary-soft); color: #fff; }
        .main-container { margin: 0 auto; padding: 26px 0 34px; }
        .panel {
            background: rgba(255, 255, 255, 0.84);
            border: 1px solid rgba(205, 220, 243, 0.88);
            border-radius: 14px;
            backdrop-filter: blur(3px);
            box-shadow: var(--card-shadow);
            padding: 18px;
        }
        .news-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(340px, 420px);
            gap: 12px;
            align-items: start;
        }
        .news-layout.single { grid-template-columns: 1fr; }
        @media (max-width: 991px) {
            .news-layout { grid-template-columns: 1fr; }
        }
        .hero-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid #dfe8f5;
        }
        .hero-title { margin: 0; font-size: 20px; font-weight: 700; color: #1e4f95; }
        .hero-subtitle { margin: 6px 0 0; color: #5e7798; font-size: 14px; }
        .news-list { display: grid; gap: 10px; }
        .news-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .news-card:hover, .news-card.active {
            border-color: #98b8e5;
            box-shadow: 0 10px 18px rgba(17, 46, 90, 0.1);
        }
        .news-card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            font-size: 12px;
            color: var(--muted-text);
        }
        .news-badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            background: #eef4ff;
            color: #1c4f9c;
        }
        .news-badge.draft { background: #fff4e5; color: #9a6700; }
        .news-preview {
            margin: 8px 0 0;
            font-size: 13px;
            color: #5a7090;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        #newsEditorPanel {
            width: 100%;
            min-width: 0;
        }
        #newsTitle {
            width: 100%;
            min-height: 72px;
            resize: vertical;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
            line-height: 1.4;
        }
        #newsBody {
            width: 100%;
            min-height: 240px;
            resize: vertical;
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        .news-card-title {
            margin: 0 0 6px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        .news-detail-title {
            margin: 0 0 8px;
            font-size: 22px;
            font-weight: 700;
            color: #1e4f95;
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        .news-detail-body {
            margin-top: 14px;
            white-space: pre-wrap;
            line-height: 1.55;
            font-size: 15px;
            color: #24344f;
        }
        .news-empty {
            padding: 28px 12px;
            text-align: center;
            color: var(--muted-text);
            font-size: 14px;
        }
        .form-control, .form-check-input {
            border-radius: 8px;
            border-color: var(--border);
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(20, 64, 128, 0.14);
        }
        .editor-actions { display: flex; flex-wrap: wrap; gap: 8px; }
        .news-modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #1e4f95;
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        .news-modal-body-text {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: break-word;
            line-height: 1.55;
            font-size: 15px;
            color: #24344f;
        }
    </style>
</head>
<body class="portal-bg-fixed">
<nav class="navbar">
    <div class="container portal-navbar-inner">
        <a href="/" class="logo"><img src="{{ url_for('project_logo') }}" alt="Логотип РУП Белнипиэнергопром"></a>
        <div class="topbar-actions">
            <span class="topbar-user fw-medium text-muted d-none d-md-inline">{{ user_display }}</span>
            <a href="/" class="btn btn-outline-secondary btn-sm topbar-btn">К ресурсам</a>
            <a href="/logout" class="btn btn-light btn-sm topbar-btn">Выход</a>
        </div>
    </div>
</nav>

<div class="container main-container">
    <div class="news-layout {% if not can_manage_news %}single{% endif %}" id="newsLayout">
        <section class="panel">
            <div class="hero-row">
                <div>
                    <h1 class="hero-title">Новости предприятия</h1>
                    <p class="hero-subtitle">Объявления и события РУП «Белнипиэнергопром»</p>
                </div>
                {% if can_manage_news %}
                <button type="button" class="btn btn-primary btn-sm" id="newNewsBtn">+ Новость</button>
                {% endif %}
            </div>
            <div id="newsList" class="news-list"></div>
            <div id="newsEmpty" class="news-empty d-none">Пока нет опубликованных новостей.</div>
        </section>

        {% if can_manage_news %}
        <aside class="panel" id="newsEditorPanel">
            <h2 class="hero-title" style="font-size: 16px;" id="editorTitle">Новая новость</h2>
            <form id="newsForm" class="mt-3">
                <input type="hidden" id="newsId" value="">
                <div class="mb-3">
                    <label class="small fw-bold text-muted mb-1">ЗАГОЛОВОК</label>
                    <textarea id="newsTitle" class="form-control" maxlength="200" rows="2" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="small fw-bold text-muted mb-1">ТЕКСТ</label>
                    <textarea id="newsBody" class="form-control" rows="10" required></textarea>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="newsPinned">
                    <label class="form-check-label" for="newsPinned">Закрепить сверху</label>
                </div>
                <div class="editor-actions">
                    <button type="submit" class="btn btn-primary btn-sm" id="saveNewsBtn">Сохранить</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm d-none" id="deleteNewsBtn">Удалить</button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="resetNewsBtn">Сброс</button>
                </div>
            </form>
        </aside>
        {% endif %}
    </div>

    <div class="modal fade" id="newsViewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <div>
                        <div class="news-card-meta mb-1" id="modalMeta"></div>
                        <h2 class="modal-title news-modal-title" id="modalTitle"></h2>
                    </div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body">
                    <div class="news-modal-body-text" id="modalBody"></div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    {% if can_manage_news %}
                    <button type="button" class="btn btn-outline-secondary" id="modalEditBtn">Редактировать</button>
                    {% endif %}
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Закрыть</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const canManageNews = {{ 'true' if can_manage_news else 'false' }};
    let newsItems = [];
    let selectedId = null;

    function escapeHtml(value) {
        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function formatNewsDate(value) {
        if (!value) return "";
        const normalized = String(value).replace(" ", "T");
        const date = new Date(normalized);
        if (Number.isNaN(date.getTime())) return String(value);
        return date.toLocaleString("ru-RU", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    function normalizeNewsText(value) {
        return String(value || "")
            .replace(/\r\n/g, "\n")
            .replace(/[ \t]+\n/g, "\n")
            .replace(/\n{2,}/g, "\n")
            .replace(/[ \t]{2,}/g, " ")
            .trim();
    }

    function previewText(body) {
        return normalizeNewsText(body).replace(/\s+/g, " ");
    }

    async function requestJson(url, options = {}) {
        const response = await fetch(url, {
            ...options,
            headers: {
                ...(options.headers || {}),
                ...(options.body ? { "Content-Type": "application/json" } : {})
            }
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
            throw new Error(data.error || "Ошибка запроса");
        }
        return data;
    }

    function renderList() {
        const list = document.getElementById("newsList");
        const empty = document.getElementById("newsEmpty");
        if (!newsItems.length) {
            list.innerHTML = "";
            empty.classList.remove("d-none");
            empty.textContent = canManageNews
                ? "Новостей пока нет. Создайте первую справа."
                : "Пока нет опубликованных новостей.";
            return;
        }
        empty.classList.add("d-none");
        list.innerHTML = newsItems.map((item) => `
            <article class="news-card ${selectedId === item.id ? "active" : ""}" data-id="${item.id}">
                <h3 class="news-card-title">${escapeHtml(item.title)}</h3>
                <div class="news-card-meta">
                    <span>${escapeHtml(formatNewsDate(item.published_at || item.created_at))}</span>
                    ${item.author_display ? `<span>${escapeHtml(item.author_display)}</span>` : ""}
                    ${item.is_pinned ? '<span class="news-badge">Закреплено</span>' : ""}
                    ${!item.is_published ? '<span class="news-badge draft">Черновик</span>' : ""}
                </div>
                <p class="news-preview">${escapeHtml(previewText(item.body))}</p>
            </article>
        `).join("");
        list.querySelectorAll(".news-card").forEach((card) => {
            card.addEventListener("click", () => openNews(Number(card.dataset.id)));
        });
    }

    let newsViewModal = null;
    let modalNewsId = null;

    function showNewsModal(item) {
        modalNewsId = item.id;
        document.getElementById("modalTitle").textContent = item.title || "";
        document.getElementById("modalBody").textContent = normalizeNewsText(item.body);
        const badges = [];
        if (item.is_pinned) badges.push('<span class="news-badge">Закреплено</span>');
        if (!item.is_published) badges.push('<span class="news-badge draft">Черновик</span>');
        document.getElementById("modalMeta").innerHTML = `
            <span>${escapeHtml(formatNewsDate(item.published_at || item.created_at))}</span>
            ${item.author_display ? `<span>${escapeHtml(item.author_display)}</span>` : ""}
            ${badges.join("")}
        `;
        if (!newsViewModal) {
            newsViewModal = new bootstrap.Modal(document.getElementById("newsViewModal"));
        }
        newsViewModal.show();
    }

    function resetEditor() {
        selectedId = null;
        document.getElementById("newsId").value = "";
        document.getElementById("newsTitle").value = "";
        document.getElementById("newsBody").value = "";
        document.getElementById("newsPinned").checked = false;
        document.getElementById("editorTitle").textContent = "Новая новость";
        document.getElementById("deleteNewsBtn").classList.add("d-none");
        renderList();
    }

    function fillEditor(item) {
        selectedId = item.id;
        document.getElementById("newsId").value = String(item.id);
        document.getElementById("newsTitle").value = item.title || "";
        document.getElementById("newsBody").value = item.body || "";
        document.getElementById("newsPinned").checked = !!item.is_pinned;
        document.getElementById("editorTitle").textContent = "Редактирование";
        document.getElementById("deleteNewsBtn").classList.remove("d-none");
        renderList();
    }

    function openNews(id) {
        const item = newsItems.find((entry) => entry.id === id);
        if (!item) return;
        selectedId = id;
        renderList();
        showNewsModal(item);
    }

    async function loadNews() {
        const url = canManageNews ? "/api/news?all=1" : "/api/news";
        newsItems = await requestJson(url);
        renderList();
        const params = new URLSearchParams(window.location.search);
        const focusId = Number(params.get("id") || 0);
        if (focusId) openNews(focusId);
    }

    if (canManageNews) {
        document.getElementById("modalEditBtn").addEventListener("click", () => {
            const item = newsItems.find((entry) => entry.id === modalNewsId);
            if (item) fillEditor(item);
            if (newsViewModal) newsViewModal.hide();
            document.getElementById("newsEditorPanel").scrollIntoView({ behavior: "smooth", block: "start" });
        });
        document.getElementById("newNewsBtn").addEventListener("click", () => {
            resetEditor();
            document.getElementById("newsTitle").focus();
        });
        document.getElementById("resetNewsBtn").addEventListener("click", resetEditor);
        document.getElementById("newsForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const payload = {
                title: document.getElementById("newsTitle").value.trim(),
                body: normalizeNewsText(document.getElementById("newsBody").value),
                is_pinned: document.getElementById("newsPinned").checked,
                is_published: true
            };
            try {
                const newsId = document.getElementById("newsId").value;
                if (newsId) {
                    await requestJson(`/api/news/${newsId}`, {
                        method: "PUT",
                        body: JSON.stringify(payload)
                    });
                } else {
                    await requestJson("/api/news", {
                        method: "POST",
                        body: JSON.stringify(payload)
                    });
                }
                await loadNews();
                resetEditor();
            } catch (error) {
                alert(error.message || "Не удалось сохранить");
            }
        });
        document.getElementById("deleteNewsBtn").addEventListener("click", async () => {
            const newsId = document.getElementById("newsId").value;
            if (!newsId) return;
            if (!confirm("Удалить эту новость?")) return;
            try {
                await requestJson(`/api/news/${newsId}`, { method: "DELETE" });
                await loadNews();
                resetEditor();
            } catch (error) {
                alert(error.message || "Не удалось удалить");
            }
        });
    }

    loadNews().catch((error) => {
        document.getElementById("newsEmpty").classList.remove("d-none");
        document.getElementById("newsEmpty").textContent = error.message || "Не удалось загрузить новости";
    });
</script>
</body>
</html>
