# Запуск на сервере: скопировать проект, при необходимости поправить volumes.
services:
  web:
    build: .
    ports:
      - "5004:5004"
    environment:
      FLASK_DEBUG: "0"
      PORTAL_SECRET_KEY: ${PORTAL_SECRET_KEY:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      LDAP_URI: ${LDAP_URI:-ldap://192.168.0.4}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-DC=local,DC=energoprom,DC=by}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_USER_ATTRIBUTE: ${LDAP_USER_ATTRIBUTE:-sAMAccountName}
      SMTP_HOST: ${SMTP_HOST:-192.168.0.28}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-robot-bnp}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-1}
      AI_ASSISTANT_PUBLIC_URL: ${AI_ASSISTANT_PUBLIC_URL:-https://ai.energoprom.by}
      AI_ASSISTANT_CALLBACK_URL: ${AI_ASSISTANT_CALLBACK_URL:-https://ai.energoprom.by/sso-login}
      AI_SSO_SHARED_SECRET: ${AI_SSO_SHARED_SECRET:-}
      AI_SSO_MAX_AGE_SEC: ${AI_SSO_MAX_AGE_SEC:-300}
    volumes:
      - ./database.db:/app/database.db
      - ./tabel_portal_cache.json:/app/tabel_portal_cache.json
      # Новостные изображения не теряются при пересоздании контейнера.
      - ./static/uploads/news:/app/static/uploads/news
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5004/healthz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped
